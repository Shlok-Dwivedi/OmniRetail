[project]
name = "omniretail"
version = "2.0.0"
description = "Retail intelligence, customer analytics and demand forecasting"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
